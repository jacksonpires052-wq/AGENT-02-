name: Agente 06 - Metricas

# Todo dia 00h20 (Brasilia) = 03h20 UTC: fecha os numeros do dia anterior,
# guarda em dados/metricas e escreve o relatorio com sugestoes.
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metricas
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    environment: instagram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Puxar e analisar os numeros
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node metricas.js --dias 14
      - name: Guardar no repositorio
        run: |
          git config user.name "Agente 06"
          git config user.email "agente06@users.noreply.github.com"
          git add dados/metricas
          git commit -m "metricas $(TZ=America/Sao_Paulo date -d yesterday +%F)" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push
