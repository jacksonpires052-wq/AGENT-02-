name: Agente 02

# 10 Reels por dia, das 6h07 as 21h07 (horario de Brasilia), nos picos de fluxo.
# Quem dispara nos horarios e o relogio.yml (o agendador do GitHub nao estava disparando).
# Os horarios ficam na lista HORARIOS do relogio.yml.
# Minutos quebrados de proposito: no minuto 0 e 30 o GitHub atrasa e as vezes pula a execucao.
on:
  workflow_dispatch:
    inputs:
      faixa:
        description: 'Faixa (1 a 4). Deixe vazio pra seguir o rodizio'
        required: false
        default: ''
      formato:
        description: 'reel ou post. Deixe vazio pra seguir o rodizio'
        required: false
        default: ''
      hora:
        description: 'Hora de Brasilia pra publicar (HH:MM). Monta antes e espera essa hora. Vazio = publica assim que montar'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: agente02
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      codigo: ${{ steps.montar.outputs.codigo }}
      formato: ${{ steps.montar.outputs.formato }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Arrumar pastas
        run: |
          mkdir -p fonts dados posts
          for f in *.otf *.ttf LICENCA-*.txt; do [ -f "$f" ] && cp -n "$f" fonts/; done
          [ -f postados.json ] && [ ! -f dados/postados.json ] && cp postados.json dados/postados.json || true
      - name: Instalar ffmpeg
        # Em 11/11 o apt travou 1 hora aqui. Agora: usa o que ja existe, tenta o apt por no maximo 4 min e, se falhar, baixa o ffmpeg pronto.
        timeout-minutes: 8
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          if timeout 240 sudo apt-get install -y -qq ffmpeg; then exit 0; fi
          curl -sSL --max-time 180 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C /tmp
          sudo cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Montar o post
        id: montar
        run: |
          ARGS="--teste"
          [ -n "${{ github.event.inputs.faixa }}" ] && ARGS="$ARGS --faixa ${{ github.event.inputs.faixa }}"
          [ -n "${{ github.event.inputs.formato }}" ] && ARGS="$ARGS --formato ${{ github.event.inputs.formato }}"
          [ -z "${{ github.event.inputs.formato }}" ] && ARGS="$ARGS --formato reel"
          node agente02.js $ARGS
      - name: Guardar o video do Reels
        if: steps.montar.outputs.formato == 'reel'
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: saida/
          retention-days: 2
      - name: Guardar as imagens no repositorio
        if: steps.montar.outputs.codigo != ''
        run: |
          git config user.name "Agente 02"
          git config user.email "agente02@users.noreply.github.com"
          git add posts dados
          git commit -m "post montado ${{ steps.montar.outputs.codigo }}" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push

  publicar:
    needs: montar
    if: needs.montar.outputs.codigo != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: instagram
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Arrumar pastas
        run: |
          mkdir -p fonts dados posts
          for f in *.otf *.ttf LICENCA-*.txt; do [ -f "$f" ] && cp -n "$f" fonts/; done
          [ -f postados.json ] && [ ! -f dados/postados.json ] && cp postados.json dados/postados.json || true
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Pegar o video do Reels
        if: needs.montar.outputs.formato == 'reel'
        uses: actions/download-artifact@v4
        with:
          name: reel
          path: saida/
      - name: Esperar a hora marcada
        if: github.event.inputs.hora != ''
        run: |
          alvo=$(TZ=America/Sao_Paulo date -d "today ${{ github.event.inputs.hora }}" +%s)
          falta=$(( alvo - $(date +%s) ))
          echo "Pronto. Publica as ${{ github.event.inputs.hora }} (faltam $falta s)"
          [ $falta -gt 0 ] && [ $falta -lt 2400 ] && sleep $falta || true
      - name: Postar no Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node agente02.js --publicar ${{ needs.montar.outputs.codigo }}
      - name: Guardar na lista de postados
        run: |
          git config user.name "Agente 02"
          git config user.email "agente02@users.noreply.github.com"
          git add dados/postados.json
          git commit -m "postado ${{ needs.montar.outputs.codigo }}" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push
